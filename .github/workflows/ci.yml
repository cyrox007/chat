name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_ACCESS_SECRET_KEY: ci-access-secret-value-at-least-32-characters-long
      JWT_REFRESH_SECRET_KEY: ci-refresh-secret-value-at-least-32-characters-long
      CSRF_SECRET_KEY: ci-csrf-secret-value-at-least-32-characters-long
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Import FastAPI application
        run: python -c "from app import app; assert app.title == 'PubChat API'"
      - name: Realtime security regression guard
        run: |
          python - <<'PY'
          from pathlib import Path
          offenders = []
          for path in Path('.').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              if '{token}' in text and 'websocket' in text.lower():
                  offenders.append(str(path))
          if offenders:
              raise SystemExit(f'Credential-like WebSocket URL found: {offenders}')
          PY
      - name: Check Alembic migration head
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic heads
      - name: Run backend contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: SPA security regression guard
        run: |
          if grep -R "setItem('access_token'" -n src; then
            echo "Persistent access token write detected"
            exit 1
          fi
          if grep -R 'setItem("access_token"' -n src; then
            echo "Persistent access token write detected"
            exit 1
          fi
          if grep -R '/ws/.*token' -n src; then
            echo "Credential-like WebSocket URL detected"
            exit 1
          fi
      - name: Build frontend
        run: npm run build
