<!DOCTYPE html>
<html lang="ru">

<head>
	<!-- Базовые метатеги -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description"
		content="PubChat - ваша платформа для мгновенного общения и совместной работы. Присоединяйтесь к разговору прямо сейчас!">
	<meta name="keywords" content="PubChat, чат, сообщения, мгновенное общение, совместная работа">
	<meta name="author" content="Ваше имя или название компании">

	<!-- Favicons -->
	<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
	<link rel="manifest" href="https://pubchat.ru/favicons/site.webmanifest">

	<!-- Open Graph (OG) теги для социальных сетей -->
	<meta property="og:title" content="PubChat - Платформа для мгновенного общения">
	<meta property="og:description"
		content="PubChat — это ваш надежный инструмент для мгновенного общения и совместной работы. Начните общаться прямо сейчас!">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://pubchat.ru"> <!-- Замените на ваш домен -->
	<meta property="og:image" content="/favicons/og-image.png">
	<!-- Укажите путь к изображению для OG -->

	<!-- Twitter Card теги -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="PubChat - Платформа для мгновенного общения">
	<meta name="twitter:description"
		content="PubChat — это ваш надежный инструмент для мгновенного общения и совместной работы. Начните общаться прямо сейчас!">
	<meta name="twitter:image" content="https://pubchat.ru/favicons/og-image.jpg">
	<!-- Укажите путь к изображению для Twitter -->

	<!-- Подключение шрифтов и стилей -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

	<!-- Заголовок страницы -->
	<title>PubChat</title>
</head>

<body>
	<div id="app"></div>
	<script type="module" src="/src/main.js"></script>
</body>

</html>
