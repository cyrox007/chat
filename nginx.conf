user root;

events {
}

http {
    # Ограничение частоты запросов
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    server {
        listen 80 default_server;
        server_name _;

        # Перенаправление всех неизвестных доменов на https://pubchat.ru
        return 301 https://pubchat.ru$request_uri;
    }

    # Перенаправление HTTP на HTTPS
    server {
        listen 80;
        server_name pubchat.ru www.pubchat.ru;

        # Перенаправление всех HTTP-запросов на HTTPS
        return 301 https://$host$request_uri;
    }

    # Настройка HTTPS
    server {
        listen 443 ssl;
        server_name pubchat.ru www.pubchat.ru;

        # Пути к SSL-сертификатам
        ssl_certificate /etc/letsencrypt/live/pubchat.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pubchat.ru/privkey.pem;

        # Настройки безопасности SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

        # Заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Проксирование запросов к frontend
        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ограничение частоты запросов
            limit_req zone=one burst=5 nodelay;
        }

        # Проксирование запросов к API backend
        location /api/ {
            proxy_pass http://backend:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Проксирование WebSocket-соединений
        location /api/ws/ {
            proxy_pass http://backend:9000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Блокировка запросов к популярным путям CMS
        location ~* ^/(wp-admin|wordpress|bitrix|admin|setup-config\.php) {
            return 403;
        }

        # Логирование подозрительных запросов
        location ~* \.(php|asp|jsp|cgi)$ {
            access_log /var/log/nginx/suspicious_requests.log;
            return 404;
        }

        # Кэширование статических файлов
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|woff|woff2|ttf|svg)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Сжатие gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1000;
        gzip_proxied any;
        gzip_vary on;
    }
}