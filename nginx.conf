server {
    listen 80;
    server_name pubchat.ru www.pubchat.ru;

    # Перенаправление HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    server_name pubchat.ru www.pubchat.ru;

    # Путь к SSL-сертификатам (выпущены Certbot)
    ssl_certificate /etc/letsencrypt/live/pubchat.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pubchat.ru/privkey.pem;

    # Безопасные настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

    # HSTS для принудительного использования HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Защита от XSS и Clickjacking
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Логирование
    access_log /var/log/nginx/pubchat.access.log;
    error_log /var/log/nginx/pubchat.error.log;

    # Проксирование запросов
    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кэширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}